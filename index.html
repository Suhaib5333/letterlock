    <div id="boot-splash" aria-hidden="true">
      <div class="boot-hex"></div>
      <div class="boot-name">LETTERLOCK</div>
    </div>
    <div id="root"></div>
    <noscript>
      <h1>Letterlock, the Letter Lock Trivia Board Game</h1>
      <p>
        Letterlock (also searched as "letter lock") is a free online trivia board game for
        two teams. Each hex on the board holds a letter; answer a trivia question whose
        answer starts with that letter to claim and lock the hex in your team's color.
        One team connects left to right, the other top to bottom, and blocking your
        opponent's path is half the fun. A fair, modern reinvention of the classic
        Blockbusters TV game show, with 180+ question packs in English and Arabic:
        general knowledge, flags, maps, movies, music, charades, and more. Play free in
        your browser on phone, tablet, laptop, or TV. Letterlock requires JavaScript;
        please enable it to play.
      </p>
    </noscript>
