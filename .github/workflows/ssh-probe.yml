# 60-second answer to "can GitHub reach the VPS over SSH right now?".
# The deploy takes 25 minutes to tell you the same thing, because the test gate
# runs first, so debugging a Hostinger connectivity wobble through it is painful.
name: ssh-probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reachability
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASS }}
        run: |
          echo "runner egress IP: $(curl -s -m 10 ifconfig.me || echo unknown)"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass netcat-openbsd >/dev/null
          for p in 22 2222; do
            if nc -z -w 8 "$H" "$p" 2>/dev/null; then echo "port $p: TCP OPEN"; else echo "port $p: TCP BLOCKED"; fi
          done
          for p in 22 2222; do
            if sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=12 -o LogLevel=ERROR -p "$p" "$U@$H" 'echo ssh-ok $(hostname)'; then
              echo "port $p: SSH OK"; exit 0
            fi
            echo "port $p: SSH FAILED"
          done
          echo "::error ::GitHub runners cannot reach the VPS on 22 or 2222"; exit 1
