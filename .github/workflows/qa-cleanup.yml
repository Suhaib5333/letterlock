# TEMPORARY one-shot cleanup — deletes ONLY the hardcoded QA accounts below.
# Runs manually (workflow_dispatch), then this file is removed from the repo.
name: QA account cleanup
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete QA users
        env:
          SUPABASE_URL: https://lkudntyvngwwlzuciocd.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Exact allowlist — nothing outside these is ever touched.
          IDS=(
            b95fc6a6-2c9f-4b27-ab62-ae3888760ea1  # qa_gate_0831 (QA, 2026-08-31)
            899e6c08-ecb0-42e7-9082-e2adea1d61b5  # qatester0624 (QA, 2026-06-24)
            e20a00d7-8ec0-4914-8fef-9a994ddd4eb0  # ral (removal requested)
          )
          EMAILS=(
            llqa0831a@maildrop.cc
            llqa0831c@maildrop.cc
            letterlock-qa-0831a@mailinator.com
          )
          auth() { curl -sf -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$@"; }
          # Resolve the profile-less QA emails to ids (small user base, one page).
          USERS=$(auth "$SUPABASE_URL/auth/v1/admin/users?page=1&per_page=1000")
          for em in "${EMAILS[@]}"; do
            id=$(echo "$USERS" | jq -r --arg em "$em" '.users[] | select(.email == $em) | .id')
            if [ -n "$id" ]; then IDS+=("$id"); echo "resolved $em -> $id"; else echo "no auth user for $em (skipped)"; fi
          done
          for id in "${IDS[@]}"; do
            email=$(auth "$SUPABASE_URL/auth/v1/admin/users/$id" | jq -r '.email // "?"') || { echo "user $id not found (skipped)"; continue; }
            auth -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$id" > /dev/null
            echo "DELETED $id ($email)"
          done
