# Send Suhaib an email from CI. The Resend key lives only in GitHub secrets, so this
# is how a session that has no local key can actually reach him.
#   gh workflow run notify.yml -f subject="..." -f body_html="<p>...</p>"
name: notify
on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Email subject'
        required: true
      body_html:
        description: 'Email body (HTML)'
        required: true
      to:
        description: 'Recipient'
        required: false
        default: suhaibrajabo@gmail.com
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBJECT: ${{ inputs.subject }}
          BODY: ${{ inputs.body_html }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          [ -n "$RESEND_API_KEY" ] || { echo "::error ::RESEND_API_KEY missing"; exit 1; }
          WRAPPED="<div style=\"font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:600px;line-height:1.6;color:#111\">$BODY</div>"
          # A plain-text alternative, a real reply_to and a unique X-Entity-Ref-ID are
          # what keep Gmail out of the Promotions tab. See docs/EMAIL_RULES.md.
          TEXT=$(printf %s "$BODY" | sed -e 's/<[^>]*>/ /g' -e 's/&nbsp;/ /g' -e 's/&rarr;/->/g' -e 's/&amp;/and/g' -e 's/  */ /g')
          PAYLOAD=$(jq -cn --arg to "$TO" --arg s "$SUBJECT" --arg h "$WRAPPED" --arg t "$TEXT" --arg r "$(uuidgen)" \
            '{from:"Letterlock ops <ops@mail.raltech.dev>", to:[$to], subject:$s, html:$h, text:$t,
              reply_to:"suhaibrajabo@gmail.com", headers:{"X-Entity-Ref-ID":$r}}')
          CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' --data "$PAYLOAD")
          cat /tmp/r.json; echo
          [ "$CODE" = "200" ] || { echo "::error ::Resend HTTP $CODE"; exit 1; }
          echo "::notice ::Sent to $TO"
