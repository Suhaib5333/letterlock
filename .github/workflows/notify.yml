# Send Suhaib an email from CI. The Resend key lives only in GitHub secrets, so this
# is how a session that has no local key can actually reach him.
#   gh workflow run notify.yml -f subject="..." -f body_html="plain text, no markup"
name: notify
on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Email subject'
        required: true
      body_html:
        description: 'Email body (PLAIN TEXT, one blank line between paragraphs)'
        required: true
      to:
        description: 'Recipient'
        required: false
        default: suhaibrajabo@gmail.com
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBJECT: ${{ inputs.subject }}
          BODY: ${{ inputs.body_html }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          [ -n "$RESEND_API_KEY" ] || { echo "::error ::RESEND_API_KEY missing"; exit 1; }
          # TEXT-ONLY. Any html part makes Gmail file a notification under
          # Promotions, see docs/EMAIL_RULES.md. `body` is plain text, not HTML.
          # Tags are stripped in case a caller still passes markup.
          TEXT=$(printf %s "$BODY" | sed -e 's/<[^>]*>/ /g' -e 's/&nbsp;/ /g' -e 's/&amp;/and/g')
          PAYLOAD=$(jq -cn --arg to "$TO" --arg s "$SUBJECT" --arg t "$TEXT" --arg r "$(uuidgen)" \
            '{from:"Letterlock server <ops@mail.raltech.dev>", to:[$to], subject:$s, text:$t,
              reply_to:"suhaibrajabo@gmail.com", headers:{"X-Entity-Ref-ID":$r}}')
          CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' --data "$PAYLOAD")
          cat /tmp/r.json; echo
          [ "$CODE" = "200" ] || { echo "::error ::Resend HTTP $CODE"; exit 1; }
          echo "::notice ::Sent to $TO"
