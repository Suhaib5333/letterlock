# The test gate. Until this existed, NOTHING in CI ran a test: deploy-vps.yml built
# the bundle and shipped it to the VPS, so a green tick only ever meant "the deploy
# script finished". Every push and pull request now runs the same suites the testing
# mandate in CLAUDE.md requires, and `deploy-vps.yml` waits for this to pass.
name: CI

on:
  # No push trigger for main/uat on purpose: deploy-vps.yml calls this workflow as
  # its gate, so a push trigger here would run every suite twice for one commit.
  pull_request:
  workflow_call: {}
  workflow_dispatch: {}

# Keyed on the CALLER too. With just the ref, the CI that gates a deploy and the CI
# that gates an OTA release share a group on the same branch and cancel each other:
# dispatching the OTA dry run killed the deploy's gate mid-run, and vice versa.
concurrency: { group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  web:
    name: Web — typecheck, unit, content gates, e2e
    runs-on: ubuntu-latest
    # The suite takes ~3 min on a dev box and ~20 on a 2-core runner, so the ceiling
    # is generous on purpose: a timeout here reads as a mystery failure.
    timeout-minutes: 45
    # tests-e2e/api-server.mjs boots the REAL apps/api against a real database
    # (playwright.config.ts `webServer`), so this job needs Postgres and the API's
    # own dependencies, not just the web ones. Without them the suite dies with
    # "Cannot find module 'pg'" — which passed locally only because a stale
    # apps/api/node_modules happened to be on disk.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ll }
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # apps/api/prisma.config.ts resolves DATABASE_URL at load time, so even
      # `prisma generate` needs it. tests-e2e/api-server.mjs creates its own
      # per-run database from this host.
      DATABASE_URL: postgresql://postgres:ll@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: npm ci
      - name: Install API deps (the e2e suite boots the real API)
        working-directory: apps/api
        run: bun install --frozen-lockfile && bunx prisma generate

      # A malformed workflow only surfaces when you try to RUN it: GitHub rejects the
      # dispatch with a parse error and everything else stays green. That is how a
      # duplicate `default:` key shipped in ota-release.yml unnoticed.
      - name: YAML parses, with NO duplicate keys
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          # Strict on duplicate keys. PyYAML accepts them silently, last one wins, and
          # that is exactly how a second `middlewares:` block in the Traefik config
          # wiped out the first and took every Letterlock route offline: valid YAML,
          # parsed fine, and Traefik rejected the whole file.
          class Strict(yaml.SafeLoader): pass
          def no_dupes(loader, node, deep=False):
              seen = set()
              for k, _ in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      raise yaml.YAMLError(f'duplicate key {key!r} on line {k.start_mark.line + 1}')
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dupes)

          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('deploy/**/*.yml', recursive=True)):
              try:
                  yaml.load(open(f, encoding='utf-8'), Strict)
                  print('ok', f)
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + content tests
        run: npm test

      - name: Content gate — no answer leaks
        run: |
          out=$(node scripts/leaks.mjs)
          if [ -n "$out" ]; then echo "$out"; echo "::error ::answers leak into their own question"; exit 1; fi

      # LAUNCH_PLAN Phase 7 "Updates": npm audit in CI. Advisory only — a new
      # advisory in a transitive dev dependency must not block a deploy at 2am —
      # but it prints in every run so nothing rots unnoticed.
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npx playwright test --reporter=line

      - name: Device matrix — nothing scrolls or clips
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 2; done
          node scripts/noscroll.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/, retention-days: 7 }

  api:
    name: API — typecheck + e2e on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ll }
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ll@localhost:55432/postgres
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      # The suite talks to a real database and does NOT create the schema itself.
      # Without this it only ever passed on a database somebody had already migrated
      # by hand, which is exactly how it passed locally and failed on the first clean
      # CI run with `relation "users" does not exist`.
      - name: Apply migrations
        run: bunx prisma migrate deploy
      - name: Typecheck
        run: bun run typecheck
      - name: e2e
        run: bun run test
