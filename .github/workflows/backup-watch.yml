# Watch the off-box backups for the first month and email Suhaib three times:
# day 1 (it works), day 7 (still working), day 31 (the 30-day rotation actually
# deleted the oldest copies). Then it stops on its own, as he asked.
#
# It SSHes to the VPS and reads the real state: the nightly log, the objects in
# the Backblaze bucket, and the bucket's lifecycle rule. The B2 key stays on the
# VPS only, it is never a GitHub secret.
#
# Inside the window a FAILED check also emails, because a backup that silently
# stops is exactly the risk this whole thing exists to remove.
# To keep the alerts running after day 31, raise WINDOW_END below.
name: Backup watch

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC daily (09:30 Bahrain), after the 03:45 backup
  workflow_dispatch:
    inputs:
      force_day:
        description: 'Pretend it is this day number (1, 7 or 31) and send that email now.'
        required: false
        default: ''

permissions:
  contents: read

env:
  START: '2026-09-08'    # first day the off-box copy worked
  WINDOW_END: '31'
  TO: suhaibrajabo@gmail.com

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Which day are we on?
        id: day
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.force_day }}" ]; then
            DAY="${{ inputs.force_day }}"
          else
            DAY=$(( ( $(date -u +%s) - $(date -u -d "$START" +%s) ) / 86400 + 1 ))
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ "$DAY" -gt "$WINDOW_END" ]; then
            echo "::notice ::Day $DAY is past the $WINDOW_END-day window. Watch is finished, nothing to do."
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the real backup state off the VPS
        if: steps.day.outputs.run == 'yes'
        id: probe
        env:
          SSHPASS: ${{ secrets.VPS_PASS }}
          VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error ::VPS_PASS secret missing"; exit 1; }
          sudo apt-get update -q && sudo apt-get install -yq sshpass
          OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          retry() {
            for i in 1 2 3 4 5 6; do
              sshpass -e ssh -p 22 $OPTS "$VPS" "$1" && return 0
              echo "attempt $i failed" >&2
              [ "$i" = 6 ] && break
              sleep $((i * 15))
            done
            return 1
          }
          retry 'tail -8 /opt/letterlock/backups/backup.log' > log.txt || echo "SSH FAILED" > log.txt
          retry 'rclone lsl letterlock-backup:letterlock-backups' > objects.txt || true
          retry 'rclone backend lifecycle letterlock-backup:letterlock-backups' > lifecycle.txt || true
          echo "--- log ---"; cat log.txt
          echo "--- objects ---"; cat objects.txt
          echo "--- lifecycle ---"; cat lifecycle.txt

          TODAY=$(date -u +%F)
          OBJ=$(wc -l < objects.txt | tr -d ' ')
          TODAY_OBJ=$(grep -c "$TODAY" objects.txt || true)
          OLDEST=$(awk '{print $2}' objects.txt | sort | head -1)
          NEWEST=$(awk '{print $2}' objects.txt | sort | tail -1)
          # Judge only TODAY, and only the LAST verdict of the day. The tail still
          # carries the nights before the remote existed, and a re-run appends a
          # second verdict for the same date, so counting matches is wrong twice over.
          LAST_RESTORE=$(grep "^$TODAY " log.txt | grep -E 'restore check ok|RESTORE CHECK FAILED' | tail -1)
          LAST_OFFBOX=$(grep "^$TODAY " log.txt | grep -E 'off-box copy ok|no rclone remote' | tail -1)
          LIFE=$(grep -c 'daysFromUploadingToHiding' lifecycle.txt || true)
          echo "last restore verdict: ${LAST_RESTORE:-none}"
          echo "last off-box verdict: ${LAST_OFFBOX:-none}"

          OK=yes
          [ "${TODAY_OBJ:-0}" -ge 3 ] || OK=no      # 2 dumps + the env tarball, dated today
          case "$LAST_RESTORE" in *'restore check ok'*) ;; *) OK=no ;; esac
          case "$LAST_OFFBOX"  in *'off-box copy ok'*) ;; *) OK=no ;; esac
          [ "${LIFE:-0}" -ge 1 ] || OK=no

          {
            echo "ok=$OK"
            echo "objects=$OBJ"
            echo "today_objects=$TODAY_OBJ"
            echo "oldest=${OLDEST:-none}"
            echo "newest=${NEWEST:-none}"
            echo 'log<<LOGEOF'; cat log.txt; echo LOGEOF
            echo 'objects_list<<OBJEOF'; cat objects.txt; echo OBJEOF
          } >> "$GITHUB_OUTPUT"
          echo "::notice ::day ${{ steps.day.outputs.day }} ok=$OK objects=$OBJ today=$TODAY_OBJ"

      - name: Email on day 1, 7 and 31, or on any failure inside the window
        if: steps.day.outputs.run == 'yes' && (steps.probe.outputs.ok != 'yes' || contains(fromJSON('["1","7","31"]'), steps.day.outputs.day))
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DAY: ${{ steps.day.outputs.day }}
          OK: ${{ steps.probe.outputs.ok }}
          OBJECTS: ${{ steps.probe.outputs.objects }}
          TODAY_OBJECTS: ${{ steps.probe.outputs.today_objects }}
          OLDEST: ${{ steps.probe.outputs.oldest }}
          NEWEST: ${{ steps.probe.outputs.newest }}
          LOG: ${{ steps.probe.outputs.log }}
          OBJECTS_LIST: ${{ steps.probe.outputs.objects_list }}
        run: |
          set -euo pipefail
          [ -n "$RESEND_API_KEY" ] || { echo "::error ::RESEND_API_KEY missing"; exit 1; }

          # TEXT-ONLY, deliberately. An HTML part is what makes Gmail file a
          # notification under Promotions; a plain-text mail with no markup, no
          # images and no links reads as person-to-person. See docs/EMAIL_RULES.md.
          if [ "$OK" != "yes" ]; then
            SUBJ="Letterlock backups need a look (day $DAY)"
            LEDE="Something is off. One of the nightly checks did not pass. The numbers below are the real state on the server right now."
          elif [ "$DAY" = "1" ]; then
            SUBJ="Letterlock off-site backups are live"
            LEDE="Your database now has a copy on someone else's computers. If the VPS is ever lost, wiped or suspended, the players, scores and progress survive."
          elif [ "$DAY" = "7" ]; then
            SUBJ="Letterlock backups: one week in, all good"
            LEDE="Seven nights, seven copies off the box, and the restore check passed every time. Nothing for you to do."
          else
            SUBJ="Letterlock backups: the 30-day rotation works, last email"
            LEDE="The oldest copies have now aged out and been deleted automatically, so the bucket holds a rolling 30 days and never grows forever. This is the last of these emails."
          fi

          TEXT=$(cat <<TEXTEOF
          Off-site backups, day $DAY

          $LEDE

          Copies in the bucket:   $OBJECTS
          Uploaded today:         $TODAY_OBJECTS  (2 databases + the env file)
          Oldest copy held:       $OLDEST
          Newest copy:            $NEWEST
          All checks passed:      $OK

          The last few nights, from the server log:

          $LOG

          What is in the bucket:

          $OBJECTS_LIST

          Sent by .github/workflows/backup-watch.yml. It checks the VPS every
          morning and only writes to you on day 1, day 7, day 31, or if a check
          fails. After day 31 it stops by itself.
          TEXTEOF
          )
          # strip the YAML block indent so the mail is not one big indented blob
          TEXT=$(printf %s "$TEXT" | sed -e 's/^          //')
          PAYLOAD=$(jq -cn --arg to "$TO" --arg s "$SUBJ" --arg t "$TEXT" --arg r "$(uuidgen)" \
            '{from:"Letterlock server <ops@mail.raltech.dev>", to:[$to], subject:$s, text:$t,
              reply_to:"suhaibrajabo@gmail.com", headers:{"X-Entity-Ref-ID":$r}}')
          CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' --data "$PAYLOAD")
          cat /tmp/r.json; echo
          [ "$CODE" = "200" ] || { echo "::error ::Resend HTTP $CODE"; exit 1; }
          echo "::notice ::Sent day-$DAY backup email to $TO (ok=$OK)"
