# Cloudflare Pages deploy — driven by GitHub Actions instead of the CF
# GitHub integration. Why: this is the only way to inject env vars from
# GitHub Actions Variables / Secrets into Cloudflare Pages (Functions and
# the build) without you ever touching the CF dashboard.
#
# ONE-TIME SETUP (5 minutes):
#   1. https://dash.cloudflare.com/profile/api-tokens → "Create Token" →
#      "Edit Cloudflare Workers" template → restrict Account to your
#      account → Resources: include the letterlock Pages project → Create
#      → copy the token.
#   2. https://dash.cloudflare.com/ → right sidebar → "Account ID" → copy.
#   3. https://github.com/Suhaib5333/letterlock/settings/secrets/actions
#      → New repository secret. Add ALL of:
#         - CLOUDFLARE_API_TOKEN         (from step 1)
#         - CLOUDFLARE_ACCOUNT_ID        (from step 2)
#         - SUPABASE_SERVICE_ROLE_KEY    (Supabase → Settings → API → service_role)
#   4. https://github.com/Suhaib5333/letterlock/settings/variables/actions
#      → New repository variable. Add (if not already):
#         - RESEND_API_KEY               (your Resend key — you said it's already there)
#         - VITE_SUPABASE_ANON_KEY       (already public, for the build)
#         - MAIL_FROM (optional)         e.g. "Letterlock <no-reply@raltech.dev>"
#   5. In Cloudflare → Pages → letterlock → Settings → Builds & deployments,
#      DISCONNECT the existing Git integration so CF doesn't double-deploy
#      every push. The GH Actions workflow becomes the sole deploy path.
#   6. Push anything to main → this workflow runs.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "3.95.0"
  PROJECT_NAME: letterlock

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-flight — verify required GitHub Secrets exist
        # Catch the 'Not logged in' / empty-env-var failures upfront with a
        # clear, actionable message instead of a Wrangler stack trace 4 steps
        # into the run. Each ENV is either populated or known-good-default —
        # if any is empty here, the user hasn't completed the one-time setup
        # at the top of this file.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Accept either RESEND_API_KEY (preferred name) or RESEND_API (the
          # name the user originally used in their GH Variables). First non-empty wins.
          RESEND_API_KEY: ${{ vars.RESEND_API_KEY || vars.RESEND_API }}
        run: |
          set -e
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ]      && missing+=("CLOUDFLARE_API_TOKEN (Repository → Secrets)")
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ]     && missing+=("CLOUDFLARE_ACCOUNT_ID (Repository → Secrets)")
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY (Repository → Secrets)")
          [ -z "$RESEND_API_KEY" ]            && missing+=("RESEND_API_KEY (Repository → Variables)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error ::Missing required GitHub secrets/variables — finish the one-time setup."
            echo ""
            echo "❌ Missing:"
            for m in "${missing[@]}"; do echo "   • $m"; done
            echo ""
            echo "Add SECRETS at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Add VARIABLES at: https://github.com/${{ github.repository }}/settings/variables/actions"
            echo ""
            echo "Where each value comes from:"
            echo "  CLOUDFLARE_API_TOKEN      → https://dash.cloudflare.com/profile/api-tokens"
            echo "                              (Create Token → 'Edit Cloudflare Workers' template,"
            echo "                              scope Resources to your letterlock Pages project)"
            echo "  CLOUDFLARE_ACCOUNT_ID     → dash.cloudflare.com sidebar → 'Account ID'"
            echo "  SUPABASE_SERVICE_ROLE_KEY → https://supabase.com/dashboard/project/lkudntyvngwwlzuciocd/settings/api"
            echo "  RESEND_API_KEY            → Resend → API Keys (you said this is already set)"
            exit 1
          fi
          echo "✓ All required secrets and variables are populated"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build app (Vite)
        # The public VITE_* keys (URL + anon) ONLY come from the committed
        # `.env.production` file. We deliberately do NOT honor GH Variables
        # or Secrets for VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY because:
        #   - The values are public-safe (anon keys are designed for the
        #     client bundle; security is enforced server-side via RLS).
        #   - The file is committed and version-controlled.
        #   - Letting `vars.X` / `secrets.X` override it lets a typo (e.g.
        #     pasting the dashboard URL instead of the .supabase.co URL)
        #     silently break prod.
        # Vite reads `.env.production` by default for `vite build`. This step
        # just runs the build + smoke-checks that the URL actually got baked
        # into the bundle — if it didn't, the .env file is missing or wrong.
        run: |
          set -e
          npm run build
          BUNDLE=$(ls dist/assets/index-*.js | head -1)
          # Look for the project subdomain — this string appears ONLY when
          # Vite successfully substituted import.meta.env.VITE_SUPABASE_URL
          # with the .env.production value. The literal phrase
          # 'VITE_SUPABASE_URL' is in the source code (the env-warning UI
          # message), so grepping for it gives false positives — we look
          # for the project ref instead.
          if ! grep -q "lkudntyvngwwlzuciocd" "$BUNDLE"; then
            echo "::error ::Built bundle does not contain the Supabase project ref. Check that .env.production is committed and has VITE_SUPABASE_URL set."
            exit 1
          fi
          echo "✓ Bundle built; Supabase URL baked in (project ref present)"

      - name: Apply Supabase database migrations
        # Optional step — runs only when SUPABASE_ACCESS_TOKEN is set as a
        # GitHub Secret. Uses Supabase's Management API
        # (POST /v1/projects/{ref}/database/query) to execute each SQL
        # migration file directly. NO DB PASSWORD NEEDED — the access token
        # is the only credential.
        #
        # The migration files in supabase/migrations/ are intentionally
        # idempotent: they use CREATE TABLE IF NOT EXISTS, CREATE OR REPLACE,
        # ADD COLUMN IF NOT EXISTS, INSERT ... ON CONFLICT DO UPDATE, etc.
        # So re-running them on every push is safe — already-applied DDL
        # is a no-op.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: lkudntyvngwwlzuciocd
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning ::Skipping migrations — set SUPABASE_ACCESS_TOKEN as a GitHub Secret to enable."
            echo ""
            echo "  Get one at: https://supabase.com/dashboard/account/tokens (Generate new)"
            echo "  Add at:     https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  Until then, paste supabase/migrations/*.sql into the dashboard SQL editor."
            exit 0
          fi
          shopt -s nullglob
          MIGRATIONS=(supabase/migrations/*.sql)
          if [ ${#MIGRATIONS[@]} -eq 0 ]; then
            echo "No migrations found in supabase/migrations/ — nothing to apply"
            exit 0
          fi
          echo "Applying ${#MIGRATIONS[@]} migration file(s) to project $PROJECT_REF…"
          for f in "${MIGRATIONS[@]}"; do
            echo "▸ $(basename "$f")"
            # Build the JSON body via node so the SQL (which contains quotes,
            # newlines, backslashes, dollar-quoted strings) is escaped safely.
            BODY=$(node -e '
              const sql = require("fs").readFileSync(process.argv[1], "utf8");
              process.stdout.write(JSON.stringify({ query: sql }));
            ' "$f")
            # Capture HTTP code + body separately.
            RESPONSE=$(printf '%s' "$BODY" | curl -sS -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-)
            HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            HTTP_BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "  ✓ applied (HTTP $HTTP_CODE)"
            else
              echo "::error ::Migration $(basename "$f") failed with HTTP $HTTP_CODE"
              echo "  Response: $HTTP_BODY" | sed 's/^/  /'
              exit 1
            fi
          done
          echo "✓ All migrations applied"

      - name: Ensure Pages project exists
        # Idempotent — `project create` errors if it already exists; we
        # swallow that case and only fail on real errors. Sets BOTH the
        # canonical CLOUDFLARE_* env vars AND the legacy CF_* aliases so
        # every Wrangler code path resolves the same credentials.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUT=$(npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create "${{ env.PROJECT_NAME }}" --production-branch=main 2>&1)
          EC=$?
          set -e
          if [ $EC -ne 0 ] && ! echo "$OUT" | grep -qi "already exists"; then
            echo "::error ::wrangler pages project create failed"
            echo "$OUT"
            exit $EC
          fi
          echo "✓ Project ${{ env.PROJECT_NAME }} ready"

      - name: Push Cloudflare Pages secrets (one-by-one, non-interactive)
        # `wrangler pages secret bulk` exists but its failure output is opaque
        # in CI and it interacts oddly with the JSON-file positional. Loop of
        # individual `secret put` calls is verbose, idempotent, and tells us
        # which specific key failed if one does.
        # Stdin pipe avoids the interactive prompt. NO_COLOR + WRANGLER_LOG=info
        # ensure the action log is readable. Values themselves never get echoed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Accept either RESEND_API_KEY (preferred name) or RESEND_API (the
          # name the user originally used in their GH Variables). First non-empty wins.
          RESEND_API_KEY: ${{ vars.RESEND_API_KEY || vars.RESEND_API }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL_VALUE: ${{ vars.VITE_SUPABASE_URL || 'https://lkudntyvngwwlzuciocd.supabase.co' }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          NO_COLOR: "1"
        run: |
          set -e
          put() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "  · $name — skipped (empty value)"
              return 0
            fi
            # Print only the name + value length to the log, never the value itself.
            echo "  → $name (${#value} chars)"
            printf '%s' "$value" | npx --yes wrangler@${{ env.WRANGLER_VERSION }} \
              pages secret put "$name" \
              --project-name="${{ env.PROJECT_NAME }}" \
              2>&1 | sed 's/^/      /'
          }
          echo "Pushing Pages secrets to '${{ env.PROJECT_NAME }}':"
          put RESEND_API_KEY            "$RESEND_API_KEY"
          put SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          put VITE_SUPABASE_URL         "$VITE_SUPABASE_URL_VALUE"
          put MAIL_FROM                 "$MAIL_FROM"
          echo "✓ Pages secrets pushed"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        run: echo "🚀 Deployed → ${{ steps.deploy.outputs.deployment-url }}"
